apiVersion: apps/v1
kind: Deployment
metadata:
  name: churilina-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: churilina-app
  template:
    metadata:
      labels:
        app: churilina-app
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: churilina-app
      containers:
        - name: app
          image: ghcr.io/churilina-polina/containerization-orchestration:sha-efbdf46
          ports:
            - containerPort: 8035
          envFrom:
            - configMapRef:
                name: churilina-config
            - secretRef:
                name: churilina-secret
          env:
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@churilina-postgres:5432/$(POSTGRES_DB)"
          readinessProbe:
            httpGet:
              path: /health
              port: 8035
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8035
            initialDelaySeconds: 15
            periodSeconds: 20
