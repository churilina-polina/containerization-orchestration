apiVersion: apps/v1
kind: Deployment
metadata:
  name: churilina-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: churilina-redis
  template:
    metadata:
      labels:
        app: churilina-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
