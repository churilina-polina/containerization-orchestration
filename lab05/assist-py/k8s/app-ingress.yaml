apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: churilina-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: churilina.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: churilina-app
                port:
                  number: 8035
